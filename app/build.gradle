plugins {
    id 'com.android.application'
}

// 发布签名：口令优先读本地 signing.properties（不进 git），其次 -P 传参 / 环境变量，
// 最后 gradle.properties。三者齐全才用 release/release.jks 签名，否则回退 debug 签名。
def signingProps = new Properties()
def signingFile = rootProject.file('signing.properties')
if (signingFile.exists()) signingProps.load(signingFile.newInputStream())

def secret = { String key ->
    signingProps.getProperty(key) ?: project.findProperty(key) ?: System.getenv(key)
}

def releaseKeyReady = {
    rootProject.file('release/release.jks').exists() &&
            secret('STORE_PASSWORD') && secret('KEY_ALIAS') && secret('KEY_PASSWORD')
}

android {
    namespace 'com.github.speedhunter'
    compileSdk 35

    defaultConfig {
        applicationId "com.github.speedhunter"
        minSdk 24
        targetSdk 34
        versionCode 47
        versionName "4.6.1"
    }

    signingConfigs {
        release {
            storeFile file('../release/release.jks')
            storePassword secret('STORE_PASSWORD')
            keyAlias secret('KEY_ALIAS')
            keyPassword secret('KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            signingConfig releaseKeyReady() ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // release 产物统一命名
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            if (variant.buildType.name == 'release') {
                output.outputFileName = "speedhunter-v${variant.versionName}.apk"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// 编完自动拷一份到 release/（AGP 8 的任务是延迟创建的，必须放进 afterEvaluate）
afterEvaluate {
    tasks.matching { it.name == 'assembleRelease' }.configureEach {
        doLast {
            def apk = "speedhunter-v${android.defaultConfig.versionName}.apk"
            copy {
                from layout.buildDirectory.file("outputs/apk/release/${apk}")
                into layout.projectDirectory.dir("../release")
            }
            println "release APK -> ../release/${apk}"
        }
    }
}

dependencies {
    // ★ 独立投屏的 Android 端 Go 协议库（native/ridedaemon 编译产物，含 libgojni.so）。
    //   不改动 native/ 下的 Go 源码时无需 Go/NDK，直接用这个预编译 AAR。
    //   注意：本仓库 .gitignore 里有 *.aar，需要用 git add -f 才能入库。
    implementation files("libs/ridedaemon.aar")
    compileOnly 'de.robv.android.xposed:api:82'

    // 模块自身的设置界面（Material You 动态取色）
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'   // 投屏二维码相机扫码
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // 仪表壁纸：选图 + 裁切（307×460 / 1024×600 两个规格）
    // uCrop 只在 JitPack 上，且 2.2.x 的 API 是 UCrop.of(uri, dst)（2.8+ 才换成 Builder）
    implementation 'com.github.yalantis:ucrop:2.2.11'
    // ★ 必须显式补：JitPack 生成的 ucrop-2.2.11.pom **没有任何 <dependencies> 段**
    //   （JitPack 的 POM 生成限制），Gradle 因此拉不到 uCrop 自己用的 androidx.exifinterface，
    //   运行时会崩：failed resolution of landroidx/exifinterface/media/exifinterface
    //   （AAR 内实测引用 androidx.appcompat / androidx.core / androidx.exifinterface 三者）
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
